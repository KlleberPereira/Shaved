<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHAVED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #09090b; color: white; overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .bg-barbershop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-image: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), 
                              url('https://images.unsplash.com/photo-1599351431202-180f0b48455d?q=80&w=2000');
            background-size: cover; background-position: center;
        }
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #ef4444; color: white; padding: 12px 24px; border-radius: 8px;
            display: none; z-index: 1000; font-size: 14px; text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .modern-input { transition: all 0.3s ease; }
        .modern-input:focus { outline: none; border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2); }
    </style>
</head>
<body>

<div class="bg-barbershop"></div>
<div id="toast" class="toast">Erro</div>
<div id="app" class="min-h-screen flex flex-col"></div>

<script>
    let currentPage = 'welcome';

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    function clearErrors() {
        const feedbackIds = ['nome-feedback', 'sobrenome-feedback', 'cpf-feedback', 'email-feedback', 'senha-feedback'];
        feedbackIds.forEach(id => {
            const el = document.getElementById(id);
            if(el) el.classList.add('hidden');
        });
    }

    function toggleVisibility(id) {
        const input = document.getElementById(id);
        const btn = document.getElementById('toggle-btn-' + id);
        if (input.type === "password") {
            input.type = "text";
            btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
        } else {
            input.type = "password";
            btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        }
    }

    function maskCPF(e) {
        let v = e.target.value.replace(/\D/g, '');
        if (v.length > 11) v = v.substring(0, 11);
        v = v.replace(/(\d{3})(\d)/, '$1.$2');
        v = v.replace(/(\d{3})(\d)/, '$1.$2');
        v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        e.target.value = v;
        validateCPFInput(v);
    }

    function isValidCPF(cpf) {
        cpf = cpf.replace(/\D/g, '');
        if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
        let sum = 0, remainder;
        for (let i = 1; i <= 9; i++) sum += parseInt(cpf.substring(i - 1, i)) * (11 - i);
        remainder = (sum * 10) % 11;
        if (remainder === 10 || remainder === 11) remainder = 0;
        if (remainder !== parseInt(cpf.substring(9, 10))) return false;
        sum = 0;
        for (let i = 1; i <= 10; i++) sum += parseInt(cpf.substring(i - 1, i)) * (12 - i);
        remainder = (sum * 10) % 11;
        if (remainder === 10 || remainder === 11) remainder = 0;
        return remainder === parseInt(cpf.substring(10, 11));
    }

    function validateCPFInput(v) {
        const feedback = document.getElementById('cpf-feedback');
        const clean = v.replace(/\D/g, '');
        if (clean.length === 11) {
            if (isValidCPF(clean)) {
                feedback.innerHTML = '<span class="italic text-green-500 text-[11px] flex items-center gap-1"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg> CPF válido</span>';
                feedback.classList.remove('hidden');
            } else {
                feedback.innerHTML = '<span class="italic text-red-400 text-[11px] flex items-center gap-1"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg> CPF inválido</span>';
                feedback.classList.remove('hidden');
            }
        } else if (clean.length > 0) {
            feedback.innerHTML = '<span class="italic text-red-400 text-[11px] flex items-center gap-1"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg> CPF inválido</span>';
            feedback.classList.remove('hidden');
        } else {
            feedback.classList.add('hidden');
        }
    }

    function validateEmailInput(e) {
        const v = e.target.value;
        const feedback = document.getElementById('email-feedback');
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (v.length > 0) {
            if (emailRegex.test(v)) {
                feedback.innerHTML = '<span class="italic text-green-500 text-[11px] flex items-center gap-1"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg> E-mail válido</span>';
                feedback.classList.remove('hidden');
            } else {
                feedback.innerHTML = '<span class="italic text-red-400 text-[11px] flex items-center gap-1"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg> E-mail inválido</span>';
                feedback.classList.remove('hidden');
            }
        } else {
            feedback.classList.add('hidden');
        }
    }

    function validatePasswordRealTime() {
        const val = document.getElementById('senha').value;
        const len = val.length >= 12;
        const upper = /[A-Z]/.test(val);
        const num = /[0-9]/.test(val);
        const special = /[^A-Za-z0-9]/.test(val);
        
        const updateReq = (id, valid) => {
            const el = document.getElementById(id);
            if(valid) {
                el.className = "italic text-green-500 text-[10px] flex items-center gap-1";
                el.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg> ${el.innerText.replace(/[✗✓]/g, '').replace('✓', '').replace('✗', '').trim()}`;
            } else {
                el.className = "italic text-red-500 text-[10px] flex items-center gap-1";
                el.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg> ${el.innerText.replace(/[✗✓]/g, '').replace('✓', '').replace('✗', '').trim()}`;
            }
        };
        updateReq('req-len', len);
        updateReq('req-upper', upper);
        updateReq('req-number', num);
        updateReq('req-special', special);
    }

    function handleRegisterFinalize() {
        const nome = document.getElementById('reg-nome').value.trim();
        const sobrenome = document.getElementById('reg-sobrenome').value.trim();
        const cpf = document.getElementById('reg-cpf').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('senha').value;
        
        const setError = (id, feedbackId, msg) => {
            const feedback = document.getElementById(feedbackId);
            feedback.innerHTML = `<span class="italic text-red-400 text-[11px] flex items-center gap-1"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg> ${msg}</span>`;
            feedback.classList.remove('hidden');
        };

        let hasError = false;
        if (nome.length === 0) { setError('reg-nome', 'nome-feedback', 'Campo obrigatório!'); hasError = true; }
        if (sobrenome.length === 0) { setError('reg-sobrenome', 'sobrenome-feedback', 'Campo obrigatório!'); hasError = true; }
        if (cpf.length === 0) { setError('reg-cpf', 'cpf-feedback', 'Campo obrigatório!'); hasError = true; }
        if (email.length === 0) { setError('reg-email', 'email-feedback', 'Campo obrigatório!'); hasError = true; }
        
        if (password.length === 0) { setError('senha', 'senha-feedback', 'É necessário criar uma senha!'); hasError = true; }
        else if (password.length < 12) { setError('senha', 'senha-feedback', 'A senha deve conter no mínimo 12 caracteres!'); hasError = true; }
        else if (!/[A-Z]/.test(password)) { setError('senha', 'senha-feedback', 'A senha deve conter pelo menos uma letra maiúscula!'); hasError = true; }
        else if (!/[0-9]/.test(password)) { setError('senha', 'senha-feedback', 'A senha deve conter pelo menos um número!'); hasError = true; }
        else if (!/[^A-Za-z0-9]/.test(password)) { setError('senha', 'senha-feedback', 'A senha deve conter pelo menos um caractere especial!'); hasError = true; }

        if (hasError) return;
        
        if (!isValidCPF(cpf)) { showToast('CPF inválido'); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('E-mail inválido'); return; }

        currentPage = 'dashboard';
        render();
    }

    function render() {
        const app = document.getElementById('app');
        if (currentPage === 'welcome') {
            app.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-screen p-6 text-center">
                    <div class="mb-8">
                        <div class="text-amber-500 mb-4 flex justify-center">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l8 8-4 4-8-8 4-4z"/><path d="M6 16l4 4-2 2-4-4 2-2z"/><path d="M16 6l-2 2"/></svg>
                        </div>
                        <h1 class="text-4xl font-bold tracking-tight text-white">SHAVED</h1>
                        <p class="text-zinc-400 mt-2">Seu estilo, Sua escolha</p>
                    </div>
                    <div class="space-y-4 w-full max-w-[280px]">
                        <button onclick="currentPage='login'; render()" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-black font-bold rounded-lg shadow-lg transition-all">Acessar como cliente</button>
                        <button onclick="currentPage='login'; render()" class="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-white font-bold rounded-lg border border-zinc-700 transition-all">Acessar como barbeiro</button>
                    </div>
                </div>
            `;
        } else if (currentPage === 'login') {
            app.innerHTML = `
                <div class="p-6 max-w-sm mx-auto w-full mt-6">
                    <h2 class="text-3xl font-bold mb-6 text-white">Login</h2>
                    <div class="space-y-4">
                        <input type="email" placeholder="E-mail" class="w-full p-4 bg-zinc-900/50 border border-zinc-700 rounded-lg text-white modern-input">
                        <div class="relative">
                            <input type="password" id="login-senha" placeholder="Senha" class="w-full p-4 bg-zinc-900/50 border border-zinc-700 rounded-lg text-white modern-input">
                            <button id="toggle-btn-login-senha" onclick="toggleVisibility('login-senha')" class="absolute right-4 top-4 text-white">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                        <button onclick="currentPage='dashboard'; render()" class="w-full py-4 bg-amber-600 hover:bg-amber-500 text-black font-bold rounded-lg transition-all">Entrar</button>
                        <button onclick="currentPage='register'; render()" class="w-full text-zinc-500 text-sm hover:text-zinc-300 transition-colors">Não tem conta? Cadastre-se</button>
                    </div>
                </div>
            `;
        } else if (currentPage === 'register') {
            app.innerHTML = `
                <div class="p-6 max-w-sm mx-auto w-full mt-6">
                    <div class="space-y-4 bg-zinc-900/40 p-6 rounded-2xl border border-white/5 shadow-2xl backdrop-blur-sm">
                        <h2 class="text-3xl font-bold mb-6 text-white text-center tracking-tight">Cadastro</h2>
                        <div class="space-y-0.5">
                            <input type="text" id="reg-nome" onfocus="clearErrors()" placeholder="Nome" oninput="this.value = this.value.toUpperCase().replace(/[0-9]/g, '')" class="w-full p-4 bg-zinc-950/50 border border-zinc-700 rounded-lg text-white modern-input">
                            <div id="nome-feedback" class="hidden mt-0.5"></div>
                        </div>
                        <div class="space-y-0.5">
                            <input type="text" id="reg-sobrenome" onfocus="clearErrors()" placeholder="Sobrenome" oninput="this.value = this.value.toUpperCase().replace(/[0-9]/g, '')" class="w-full p-4 bg-zinc-950/50 border border-zinc-700 rounded-lg text-white modern-input">
                            <div id="sobrenome-feedback" class="hidden mt-0.5"></div>
                        </div>
                        <div class="space-y-0.5">
                            <input type="text" id="reg-cpf" onfocus="clearErrors()" placeholder="CPF" oninput="maskCPF(event)" maxlength="14" class="w-full p-4 bg-zinc-950/50 border border-zinc-700 rounded-lg text-white modern-input">
                            <div id="cpf-feedback" class="hidden mt-0.5"></div>
                        </div>
                        <div class="space-y-0.5">
                            <input type="email" id="reg-email" onfocus="clearErrors()" placeholder="E-mail" oninput="validateEmailInput(event)" class="w-full p-4 bg-zinc-950/50 border border-zinc-700 rounded-lg text-white modern-input">
                            <div id="email-feedback" class="hidden mt-0.5"></div>
                        </div>
                        <div class="relative w-full space-y-0.5">
                            <input type="password" id="senha" onfocus="clearErrors(); document.getElementById('senha-instrucoes').classList.remove('hidden')" 
                                onblur="document.getElementById('senha-instrucoes').classList.add('hidden')"
                                oninput="validatePasswordRealTime()"
                                placeholder="Criar Senha" class="w-full p-4 bg-zinc-950/50 border border-zinc-700 rounded-lg text-white modern-input">
                            <button id="toggle-btn-senha" onclick="toggleVisibility('senha')" class="absolute right-4 top-4 text-white">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                            <div id="senha-feedback" class="hidden mt-0.5"></div>
                            <div id="senha-instrucoes" class="italic text-zinc-500 text-[10px] px-1 hidden space-y-1 mt-1 transition-all">
                                <p>A senha deve conter pelo menos:</p>
                                <div id="req-len" class="italic text-red-500 flex items-center gap-1">No mínimo 12 caracteres</div>
                                <div id="req-upper" class="italic text-red-500 flex items-center gap-1">Uma letra maiúscula</div>
                                <div id="req-number" class="italic text-red-500 flex items-center gap-1">Um número</div>
                                <div id="req-special" class="italic text-red-500 flex items-center gap-1">Um caractere especial</div>
                            </div>
                        </div>
                        <div class="flex gap-4 pt-2">
                            <button onclick="currentPage='login'; render()" class="w-1/3 py-4 bg-zinc-800 hover:bg-zinc-700 text-white font-bold rounded-lg transition-all">Voltar</button>
                            <button onclick="handleRegisterFinalize()" class="w-2/3 py-4 bg-amber-600 hover:bg-amber-500 text-black font-bold rounded-lg transition-all shadow-lg hover:shadow-amber-500/20">Finalizar Cadastro</button>
                        </div>
                    </div>
                </div>
            `;
        } else if (currentPage === 'dashboard') {
            app.innerHTML = `
                <div class="h-full flex flex-col">
                    <header class="p-6 pt-12 flex justify-between items-center bg-black/20 backdrop-blur-md">
                        <div class="font-bold text-amber-500 italic">SHAVED</div>
                    </header>
                    <main class="flex-grow p-4">
                        <input type="text" placeholder="Buscar barbearias..." class="w-full p-4 bg-black/40 rounded-xl border border-white/10 text-white modern-input">
                    </main>
                    <nav class="fixed bottom-0 w-full bg-zinc-950 border-t border-zinc-800 p-3 flex justify-around">
                        <button class="text-amber-500 text-2xl">🔍</button>
                        <button class="text-zinc-500 text-2xl">📍</button>
                        <button class="text-zinc-500 text-2xl">📅</button>
                    </nav>
                </div>
            `;
        }
    }
    render();
</script>
</body>
</html>
